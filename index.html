<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cybsecme - Quicklinks Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Quicklinks Dashboard</h1>
            <p id="current-time" class="current-time"></p>
        </header>

        <div class="dashboard-grid">
            <!-- Water Monitoring Section -->
            <section class="card water-monitoring">
                <h2>💧 Water Monitoring</h2>
                <div id="water-content" class="loading">Loading water data...</div>
                <canvas id="waterChart"></canvas>
                <iframe 
                    src="https://waterdata.usgs.gov/monitoring-location/USGS-50061800#dataTypeId=continuous-00065-0&period=P7D&showFieldMeasurements=true" 
                    width="100%" 
                    height="500" 
                    frameborder="0"
                    title="USGS Water Monitoring Data">
                </iframe>
            </section>

            <!-- Weather Section -->
            <section class="card">
                <h2>🌤️ Weather</h2>
                <div id="weather-content" class="loading">Loading weather...</div>
            </section>

            <!-- Safety Alerts Section -->
            <section class="card">
                <h2>⚠️ Safety Alerts</h2>
                <div id="safety-content" class="loading">Loading alerts...</div>
            </section>

            <!-- Local News Section -->
            <section class="card">
                <h2>📰 Local News</h2>
                <div id="news-content" class="loading">Loading news...</div>
            </section>

            <!-- Quick Links Section -->
            <section class="card">
                <h2>🔗 Quick Links</h2>
                <div id="links-content" class="loading">Loading links...</div>
            </section>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
