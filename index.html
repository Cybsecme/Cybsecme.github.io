<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cybsecme - Quicklinks Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Quicklinks Dashboard</h1>
            <p id="current-time" class="current-time"></p>
        </header>

        <div class="dashboard-grid">
            <!-- Water Monitoring Section -->
            <section class="card water-monitoring">
                <h2>💧 Water Monitoring</h2>
                <div id="water-content" class="loading">Loading water data...</div>
                <canvas id="waterChart"></canvas>
            </section>

            <!-- Weather Section -->
            <section class="card">
                <h2>🌤️ Weather</h2>
                <div id="weather-content" class="loading">Loading weather...</div>
            </section>

            <!-- Earthquake Monitor Section -->
            <section class="card">
                <h2>⚡ Earthquake Monitor</h2>
                <div id="earthquake-content" class="loading">Loading seismic data...</div>
            </section>

            <!-- Tides & Currents Section -->
            <section class="card">
                <h2>🌊 Tides & Currents</h2>
                <div id="tides-content" class="loading">Loading tides data...</div>
            </section>

            <!-- Local News Section -->
            <section class="card">
                <h2>📰 Local News</h2>
                <div id="news-content" class="loading">Loading news...</div>
            </section>

            <!-- Quick Links Section -->
            <section class="card">
                <h2>🔗 Quick Links</h2>
                <div id="links-content" class="loading">Loading links...</div>
            </section>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
